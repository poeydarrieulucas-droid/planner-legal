<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planner Legal</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --primary: #1d4ed8;
        --text: #111827;
        --muted: #4b5563;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 32px 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 28px rgba(17, 24, 39, 0.05);
        padding: 32px;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .tag {
        display: inline-block;
        background: rgba(29, 78, 216, 0.08);
        color: var(--primary);
        font-weight: 700;
        border-radius: 999px;
        padding: 8px 12px;
        margin-bottom: 16px;
      }

      p {
        color: var(--muted);
        font-size: 1.06rem;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        text-decoration: underline;
      }

      .button {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
      }

      .button.secondary {
        background: transparent;
        color: var(--primary);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="tag">Application</div>
        <h1>Planner Legal</h1>
        <p>
          Planner Legal aide les professionnels à organiser les tâches, les échéances et
          les documents juridiques avec plus de clarté et de sérénité.
        </p>

        <div class="links">
          <a class="button" href="privacy.html">Politique de confidentialité</a>
          <a class="button secondary" href="terms.html">Conditions générales</a>
        </div>
      </section>
    </main>
  </body>
</html>
